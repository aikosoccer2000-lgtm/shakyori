<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18232e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>斜距離計算</title>
<style>
/* 現場の野帳: 入力2つ → 大きな答え → 図 → 記録。片手で親指操作できる縦一列 */
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#18232e; --muted:#5d6b78; --line:#d5dce3;
  --accent:#e09400; --accent-ink:#1a1300; --diag:#c4410f;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Meiryo","Noto Sans JP",sans-serif;
  --f-num:"Roboto Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171d; --card:#1a222a; --ink:#e8edf2; --muted:#93a1ae; --line:#2c3843;
  --accent:#f2b134; --accent-ink:#1a1300; --diag:#ff8a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d; --card:#1a222a; --ink:#e8edf2; --muted:#93a1ae; --line:#2c3843;
  --accent:#f2b134; --accent-ink:#1a1300; --diag:#ff8a5c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0;text-wrap:balance;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1 small{font-size:12px;color:var(--muted);font-weight:400}
.units{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.units button{border:0;background:transparent;color:var(--muted);font:700 14px var(--f-body);padding:6px 14px;cursor:pointer}
.units button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
label.f span{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.05em}
label.f input{border:0;background:transparent;color:var(--ink);font:700 28px var(--f-num);width:100%;min-width:0;padding:0;outline:none;font-variant-numeric:tabular-nums}
label.f:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.result{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.result .lbl{font-size:13px;letter-spacing:.08em;opacity:.75}
.result .big{font:700 46px/1.1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--accent);word-break:break-all}
.result .big small{font-size:20px;margin-left:6px;color:var(--bg)}
.result .sub{font:500 15px var(--f-num);opacity:.85}
.result .formula{font-size:12px;opacity:.7;margin-top:4px;font-family:var(--f-num)}
svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
.memo{display:flex;gap:8px}
.memo input{flex:1;min-width:0;font:16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.btn{font:700 16px var(--f-body);padding:10px 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:focus-visible,.units button:focus-visible,.hist button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:15px;margin:6px 0 0;color:var(--muted);letter-spacing:.05em}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.hist li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
.hist .load{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;font:inherit}
.hist .name{font-size:14px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .nums{font:500 13px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.hist .nums b{color:var(--diag)}
.hist .del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font:13px var(--f-body);cursor:pointer}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.note{font-size:12px;color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <h1>斜距離計算 <small>建物の対角を確認</small></h1>

  <div class="row">
    <span class="note">入力の単位</span>
    <div class="units" role="group" aria-label="単位">
      <button type="button" id="u-mm" aria-pressed="true">mm</button>
      <button type="button" id="u-m" aria-pressed="false">m</button>
    </div>
  </div>

  <div class="inputs">
    <label class="f"><span>縦</span><input id="tate" inputmode="decimal" autocomplete="off" value="7280"></label>
    <label class="f"><span>横</span><input id="yoko" inputmode="decimal" autocomplete="off" value="9100"></label>
  </div>

  <div class="result" aria-live="polite">
    <span class="lbl">斜距離（対角）</span>
    <span class="big" id="big">—</span>
    <span class="sub" id="sub"></span>
    <span class="formula" id="formula"></span>
  </div>

  <svg id="fig" viewBox="0 0 320 220" role="img" aria-label="寸法図"></svg>

  <div class="memo">
    <input id="memo" placeholder="メモ（例：服部邸 建物）" autocomplete="off">
    <button class="btn" id="save" type="button">記録</button>
  </div>

  <h2>記録</h2>
  <ul class="hist" id="hist"></ul>
  <p class="note">最初に入っている 7280 × 9100 は例です。記録はこの携帯の中だけに残ります。一度開けば電波がなくても使えます。</p>
</div>

<script>
const $ = id => document.getElementById(id);
let unit = 'mm';
try { unit = localStorage.getItem('sk_unit') || 'mm'; } catch(e){}

function num(s){ s = String(s).replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/,/g,''); const v = parseFloat(s); return isFinite(v) && v > 0 ? v : NaN; }
function toMM(v){ return unit === 'mm' ? v : v * 1000; }
const fmtMM = v => Math.round(v).toLocaleString('ja-JP');
const fmtM = v => (v/1000).toFixed(3);

function setUnit(u, convert){
  if (convert && u !== unit){
    for (const id of ['tate','yoko']){
      const v = num($(id).value);
      if (!isNaN(v)) $(id).value = u === 'm' ? +(v/1000).toFixed(3) : Math.round(v*1000);
    }
  }
  unit = u;
  $('u-mm').setAttribute('aria-pressed', u==='mm'); $('u-m').setAttribute('aria-pressed', u==='m');
  try { localStorage.setItem('sk_unit', u); } catch(e){}
  calc();
}

function calc(){
  const a = num($('tate').value), b = num($('yoko').value);
  if (isNaN(a) || isNaN(b)){ $('big').textContent='—'; $('sub').textContent='縦と横を入れてください'; $('formula').textContent=''; draw(); return null; }
  const A = toMM(a), B = toMM(b), C = Math.hypot(A, B);
  if (unit === 'mm'){
    $('big').innerHTML = fmtMM(C) + '<small>mm</small>';
    $('sub').textContent = fmtM(C) + ' m';
  } else {
    $('big').innerHTML = fmtM(C) + '<small>m</small>';
    $('sub').textContent = fmtMM(C) + ' mm';
  }
  $('formula').textContent = `√(${fmtMM(A)}² + ${fmtMM(B)}²)`;
  draw(A, B, C);
  return {A, B, C};
}

function draw(A, B, C){
  const svg = $('fig');
  if (!A){ svg.innerHTML = ''; return; }
  const W = 320, H = 220, pad = 44;
  const s = Math.min((W-pad*2)/B, (H-pad*2)/A);
  const w = B*s, h = A*s, x = (W-w)/2, y = (H-h)/2;
  const cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue('--ink'), muted = cs.getPropertyValue('--muted'), diag = cs.getPropertyValue('--diag');
  svg.innerHTML = `
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${ink}" stroke-width="2"/>
    <line x1="${x}" y1="${y+h}" x2="${x+w}" y2="${y}" stroke="${diag}" stroke-width="2.5"/>
    <line x1="${x}" y1="${y}" x2="${x+w}" y2="${y+h}" stroke="${diag}" stroke-width="1" stroke-dasharray="5 4" opacity=".6"/>
    <text x="${x+w/2}" y="${y+h+22}" text-anchor="middle" font-family="Roboto Mono,monospace" font-size="13" fill="${muted}">横 ${fmtMM(B)}</text>
    <text x="${x-10}" y="${y+h/2}" text-anchor="middle" font-family="Roboto Mono,monospace" font-size="13" fill="${muted}" transform="rotate(-90 ${x-10} ${y+h/2})" dy="-4">縦 ${fmtMM(A)}</text>
    <text x="${W/2}" y="${y-12}" text-anchor="middle" font-family="Roboto Mono,monospace" font-size="14" font-weight="700" fill="${diag}">斜 ${fmtMM(C)}</text>`;
}

let hist = [];
try { hist = JSON.parse(localStorage.getItem('sk_hist') || '[]'); } catch(e){ hist = []; }
function saveHist(){ try { localStorage.setItem('sk_hist', JSON.stringify(hist)); } catch(e){} }
function renderHist(){
  const ul = $('hist'); ul.innerHTML = '';
  if (!hist.length){ ul.innerHTML = '<li class="empty">まだありません。「記録」で残せます。</li>'; return; }
  hist.forEach((h, i) => {
    const li = document.createElement('li');
    const name = h.memo || new Date(h.t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    li.innerHTML = `<button class="load" type="button"><span class="name"></span><span class="nums">${fmtMM(h.A)} × ${fmtMM(h.B)} → <b>${fmtMM(h.C)}</b> mm</span></button><button class="del" type="button">削除</button>`;
    li.querySelector('.name').textContent = name;
    li.querySelector('.load').onclick = () => {
      $('tate').value = unit==='mm' ? Math.round(h.A) : +(h.A/1000).toFixed(3);
      $('yoko').value = unit==='mm' ? Math.round(h.B) : +(h.B/1000).toFixed(3);
      $('memo').value = h.memo || ''; calc(); window.scrollTo({top:0,behavior:'smooth'});
    };
    li.querySelector('.del').onclick = () => { hist.splice(i,1); saveHist(); renderHist(); };
    ul.appendChild(li);
  });
}

$('save').onclick = () => {
  const r = calc(); if (!r) return;
  hist.unshift({...r, memo: $('memo').value.trim(), t: Date.now()});
  hist = hist.slice(0, 50); saveHist(); renderHist(); $('memo').value = '';
  $('save').textContent = '記録しました'; setTimeout(() => $('save').textContent = '記録', 1200);
};
$('u-mm').onclick = () => setUnit('mm', true);
$('u-m').onclick = () => setUnit('m', true);
['tate','yoko'].forEach(id => { $(id).addEventListener('input', calc); $(id).addEventListener('focus', e => e.target.select()); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => calc());

if (unit === 'm'){ $('tate').value = 7.28; $('yoko').value = 9.1; }
setUnit(unit, false);
renderHist();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
